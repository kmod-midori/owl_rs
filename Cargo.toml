[package]
name = "owl_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "AirDrop CLI and daemon with safe Rust AWDL"

[dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
bytes = "1"
etherparse = "0.19"
cpio-archive = "0.10"
flate2 = "1"
fs2 = "0.4"
hickory-proto = { version = "0.25", default-features = false, features = ["mdns"] }
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
nix = { version = "0.31", features = ["user", "fs"] }
openssl = "0.10"
plist = "1"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
tokio-openssl = "0.6"
tokio-util = { version = "0.7", features = ["rt", "io"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
toml = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
futures-util = "0.3"
pcap = { version = "2", features = ["capture-stream"] }
radiotap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "sync", "net", "io-util", "fs"] }
tun-rs = { version = "2", features = ["async_tokio"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rtnetlink = "0.23"
wl-nl80211 = "0.8"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
