# How owl_rs runs AWDL on each kernel Wi-Fi driver, named as in
# /sys/class/net/<iface>/device/driver. An unlisted driver uses profiles.default
# and requires --allow-untested. Use --profiles PATH to try a custom TOML file.
#
# tested: true means tested hardware; false requires --allow-untested.
# mode:
#   shared: AWDL shares the AP's channel and Wi-Fi stays connected.
#   exclusive: Wi-Fi is disconnected for the session, for cards that cannot
#     inject or hear AWDL while associated. Works without an AP and only
#     reconnects a previously connected station.
# mon_mac:
#   station: shared mode uses the current station MAC; exclusive mode uses the
#     random MAC generated once per owld start, including the ACK interface.
#   own: exclusive mode derives a separate monitor address from the random MAC.
#     Shared mode always reuses the current station MAC. The runtime uses the
#     monitor's actual address.
# reconnect: reconnect after deleting the monitor interface, for drivers whose
#   station stops receiving afterward.
# mt76_pm: disable mt76 runtime power management and deep sleep for the session,
#   then restore the saved settings during cleanup.
# supports_tx_ldpc: the injection driver can request hardware LDPC encoding.
#   Defaults to false when omitted. This declares support; --fec bcc remains the
#   CLI default. Opt in with --fec auto or --fec ldpc. RX LDPC bits do not prove
#   TX support. MT76x2 support follows the upstream TX descriptor implementation;
#   injected LDPC still needs on-air validation.
# tx_noack: request unicast transmission without waiting for hardware ACKs.
#   Defaults to false. Keep true only for a driver workaround; --tx-ack normal
#   overrides it. This is independent of shared/exclusive mode and channel pinning.
# exclusive_backend:
#   ibss: join AWDL's BSSID on owlibss0 and inject through a passive monitor.
#   active-monitor: an active monitor ACKs unicast; the existing station becomes
#     a passive monitor for tuning. Requires hardware support and mon_mac=station.
#   Ignored in shared mode. There is no automatic fallback between backends.
# Hardware and observed behavior are documented below as comments, not fields.

# MediaTek MT7925 (Framework 13). Injects while associated, sending from the
# station's MAC; the station ACKs the phone's unicast. Without a reconnect, the
# station stops receiving 3-165 s after a monitor interface is deleted.
[profiles.mt7925e]
tested = true
mode = "shared"
mon_mac = "station"
reconnect = true
mt76_pm = true
supports_tx_ldpc = false
exclusive_backend = "ibss"

# Intel AX201, kernel 6.8. Associated, the firmware passes up no AWDL frames.
# Starts no ad-hoc cell on 5 GHz, so runs on channel 6: a 2.4 MB photo from an
# iPhone in 17 s, to it in 10.5 s. The AX200 and AX211 are untested.
[profiles.iwlwifi]
# Retain the original Intel firmware workaround.
tx_noack = true
tested = true
mode = "exclusive"
mon_mac = "station"
reconnect = false
mt76_pm = false
supports_tx_ldpc = false
exclusive_backend = "ibss"

# MediaTek MT7612U USB (0e8d:7612), kernel 7.2.9. Active monitor plus the existing
# station as a passive monitor; channel 6 is preferred for discovery. Images
# transferred in both directions; sending uses BLE wake-up.
# Channel changes can cancel the driver's TX-status cleanup worker, causing
# normal-ACK injection to stall. Use --tx-ack normal after the driver is fixed.
[profiles.mt76x2u]
tx_noack = true
tested = true
mode = "exclusive"
mon_mac = "station"
reconnect = false
mt76_pm = true
supports_tx_ldpc = true
exclusive_backend = "active-monitor"

# Any other card. Needs monitor-mode injection while associated, and an AP on
# channel 6, 44 or 149.
[profiles.default]
tested = false
mode = "shared"
mon_mac = "station"
reconnect = true
mt76_pm = false
supports_tx_ldpc = false
exclusive_backend = "ibss"
